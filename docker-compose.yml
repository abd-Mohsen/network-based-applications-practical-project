services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP (what every service exports traces to)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  trip-service:
    build: ./services/trip-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      RABBITMQ_URL: amqp://rabbitmq:5672
      OUTBOX_ENABLED: "true"
      OTEL_SERVICE_NAME: trip-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      rabbitmq:
        condition: service_healthy

  fraud-check-service:
    build: ./services/fraud-check-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      OTEL_SERVICE_NAME: fraud-check-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

  payment-service:
    build: ./services/payment-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      RABBITMQ_URL: amqp://rabbitmq:5672
      FRAUD_CHECK_URL: http://fraud-check-service:3002
      IDEMPOTENCY_ENABLED: "true"
      OTEL_SERVICE_NAME: payment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      rabbitmq:
        condition: service_healthy
      fraud-check-service:
        condition: service_started

  notification-service:
    build: ./services/notification-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      RABBITMQ_URL: amqp://rabbitmq:5672
      WEBHOOK_SECRET: dev-secret
      OTEL_SERVICE_NAME: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    environment:
      PORT: 3000
      JWT_SECRET: dev-secret
      TRIP_SERVICE_URL: http://trip-service:3001
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - trip-service

  edge:
    build: ./services/edge
    ports:
      - "3080:80"
    depends_on:
      - gateway

  monitor:
    build: ./services/monitor
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      GATEWAY_URL: http://gateway:3000
      TRIP_SERVICE_URL: http://trip-service:3001
      FRAUD_CHECK_URL: http://fraud-check-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      - trip-service
      - payment-service
      - notification-service
      - gateway

  web:
    build: ./services/web
    ports:
      - "8080:8080"
    # Lets the control room's "Stop/Start gateway" buttons actually stop and
    # start the gateway container (Docker Engine API over the socket) --
    # that's what produces a genuine Nginx 502/504 at the edge, not a
    # software pretend-outage. Dev/demo-only: this gives the web container
    # host-level Docker control, which is NOT something you'd ship as-is.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 8080
      GATEWAY_URL: http://edge:80
      TRIP_SERVICE_URL: http://trip-service:3001
      PAYMENT_SERVICE_URL: http://payment-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      FRAUD_CHECK_URL: http://fraud-check-service:3002
      MONITOR_URL: http://monitor:4000
      OTEL_SERVICE_NAME: web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      - edge
      - trip-service
      - payment-service
      - notification-service
      - fraud-check-service
      - monitor
