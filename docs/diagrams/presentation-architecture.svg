<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 710" width="1760" height="710">
  <rect x="0" y="0" width="1760" height="710" fill="#F7F6F2"/>

  <defs>
    <marker id="arrow-async" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#0E7C86"/>
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#6B4FA0"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#B3730A"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#70788A"/>
    </marker>
    <marker id="arrow-ws" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#1A7FBF"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="40" y="34" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="20" fill="#1C2127">RideFlow — presentation architecture</text>
  <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#646E7A">clients → API Gateway (Nginx · JWT · rate limit) → services; driver app gets live updates over WebSocket — see legend bottom-left</text>

  <!-- ========================= CLIENTS ========================= -->
  <rect x="140" y="90" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="240" y="115" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">Rider app</text>

  <rect x="420" y="90" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="520" y="115" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">Driver app</text>

  <!-- rider -> gateway (writes) -->
  <line x1="240" y1="130" x2="300" y2="190" stroke="#70788A" stroke-width="2.2" marker-end="url(#arrow-neutral)"/>
  <text x="150" y="165" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A">POST /api/trips (+cancel)</text>

  <!-- driver -> gateway (writes) -->
  <line x1="450" y1="130" x2="420" y2="190" stroke="#70788A" stroke-width="2.2" marker-end="url(#arrow-neutral)"/>
  <text x="405" y="165" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A" text-anchor="end">accept / complete</text>

  <!-- gateway -> driver (WebSocket push) -->
  <line x1="460" y1="190" x2="590" y2="130" stroke="#1A7FBF" stroke-width="2.6" stroke-dasharray="1 6" stroke-linecap="round" marker-end="url(#arrow-ws)"/>
  <text x="600" y="150" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#1A7FBF" font-weight="bold">WebSocket</text>
  <text x="600" y="163" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A">(new ride pushed, ~1s)</text>

  <!-- ========================= API GATEWAY (merged edge + gateway) ========================= -->
  <rect x="250" y="190" width="240" height="72" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="370" y="214" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">API Gateway (Nginx)</text>
  <text x="370" y="230" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#646E7A" text-anchor="middle">:3080 → :80 · JWT issue/verify</text>
  <text x="370" y="243" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#646E7A" text-anchor="middle">2 req/min per user</text>
  <text x="370" y="256" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#646E7A" text-anchor="middle">reverse proxy + rate limit + auth, one hop</text>

  <line x1="490" y1="226" x2="550" y2="226" stroke="#70788A" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <text x="520" y="214" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#646E7A" text-anchor="middle">proxy</text>
  <text x="520" y="245" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#646E7A" text-anchor="middle">/trips*</text>

  <rect x="550" y="190" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="650" y="220" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">trip-service</text>
  <text x="650" y="236" font-family="DejaVu Sans Mono, monospace" font-size="9" fill="#0E7C86" text-anchor="middle">requested→accepted→completed</text>
  <text x="650" y="249" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#646E7A" text-anchor="middle">predicts fare · outbox pattern</text>

  <!-- trip-service -> Q1 -->
  <line x1="650" y1="262" x2="650" y2="340" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="662" y="295" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A">publish on /complete</text>
  <text x="662" y="308" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A">(outbox — crash-safe)</text>

  <!-- ========================= ASYNC SPINE ========================= -->
  <rect x="550" y="340" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="650" y="362" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">RabbitMQ queue</text>
  <text x="650" y="380" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="12.5" fill="#0E7C86" text-anchor="middle">trip.completed</text>

  <line x1="750" y1="372" x2="840" y2="372" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="795" y="360" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A" text-anchor="middle">consume</text>

  <line x1="650" y1="396" x2="650" y2="490" stroke="#B3730A" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-fail)"/>
  <text x="662" y="435" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#B3730A">retries</text>
  <text x="662" y="448" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#B3730A">exhausted</text>

  <rect x="550" y="490" width="200" height="48" rx="8" fill="#F7F6F2" stroke="#3A4654" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="650" y="510" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A" text-anchor="middle">dead-letter queue</text>
  <text x="650" y="527" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="11.5" fill="#B3730A" text-anchor="middle">trip.completed.dlq</text>

  <rect x="840" y="340" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="940" y="362" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">payment-service</text>
  <text x="940" y="380" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#646E7A" text-anchor="middle">idempotency · retry · breaker</text>

  <!-- payment <-> fraud -->
  <line x1="940" y1="396" x2="940" y2="490" stroke="#6B4FA0" stroke-width="2.5" marker-start="url(#arrow-sync)" marker-end="url(#arrow-sync)"/>
  <text x="952" y="430" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A">sync REST check ·</text>
  <text x="952" y="443" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A">retry + circuit breaker</text>

  <rect x="840" y="490" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="940" y="513" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13" fill="#1C2127" text-anchor="middle">fraud-check-service</text>
  <text x="940" y="530" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#646E7A" text-anchor="middle">flaky · chaos-toggleable</text>

  <line x1="1040" y1="372" x2="1130" y2="372" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="1085" y="360" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A" text-anchor="middle">publish</text>

  <rect x="1130" y="340" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="1230" y="362" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">RabbitMQ queue</text>
  <text x="1230" y="380" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="12.5" fill="#0E7C86" text-anchor="middle">payment.completed</text>

  <line x1="1330" y1="372" x2="1420" y2="372" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="1375" y="360" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A" text-anchor="middle">consume</text>

  <rect x="1420" y="340" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="1520" y="362" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13" fill="#1C2127" text-anchor="middle">notification-service</text>
  <text x="1520" y="380" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#646E7A" text-anchor="middle">signs + sends webhook (external)</text>

  <!-- ========================= LEGEND ========================= -->
  <line x1="40" y1="600" x2="62" y2="600" stroke="#0E7C86" stroke-width="3"/>
  <text x="68" y="604" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">async · queue-mediated</text>

  <line x1="270" y1="600" x2="292" y2="600" stroke="#6B4FA0" stroke-width="3"/>
  <text x="298" y="604" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">sync · request/response (REST)</text>

  <line x1="560" y1="600" x2="582" y2="600" stroke="#B3730A" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="588" y="604" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">failure path · dead-letter</text>

  <line x1="40" y1="630" x2="62" y2="630" stroke="#70788A" stroke-width="3"/>
  <text x="68" y="634" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">writes / reverse proxy path</text>

  <line x1="330" y1="630" x2="352" y2="630" stroke="#1A7FBF" stroke-width="2.6" stroke-dasharray="1 6" stroke-linecap="round"/>
  <text x="358" y="634" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1A7FBF" font-weight="bold">WebSocket</text>
  <text x="440" y="634" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">— server→driver app, live push</text>

  <text x="40" y="670" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A">Driver app receives live ride updates over WebSocket from the API Gateway. notification-service's webhook is a separate, signed, server-to-server call made externally.</text>
</svg>
