<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 460" width="1560" height="460">
  <rect x="0" y="0" width="1560" height="460" fill="#F7F6F2"/>

  <defs>
    <marker id="arrow-async" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#0E7C86"/>
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#6B4FA0"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#B3730A"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 10 8" markerWidth="9" markerHeight="7" refX="8" refY="4" orient="auto-start-reverse">
      <polygon points="0,0 9,3.5 0,7" fill="#70788A"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="40" y="34" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="20" fill="#1C2127">RideFlow system map</text>
  <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#646E7A">sync edges in violet, async (queue-mediated) edges in teal, the failure path dashed in amber</text>

  <!-- ===== edges ===== -->

  <!-- web -> Gateway -->
  <line x1="220" y1="118" x2="296" y2="118" stroke="#70788A" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <text x="258" y="108" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A" text-anchor="middle">writes</text>
  <text x="130" y="162" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#646E7A" text-anchor="middle">reads: polls trip/payment/</text>
  <text x="130" y="174" font-family="DejaVu Sans, sans-serif" font-size="10" fill="#646E7A" text-anchor="middle">notification/monitor directly</text>

  <!-- Gateway -> TripService -->
  <line x1="390" y1="146" x2="390" y2="226" stroke="#70788A" stroke-width="2.5" marker-end="url(#arrow-neutral)"/>
  <text x="400" y="182" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A">proxy ·</text>
  <text x="400" y="196" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A">verify JWT</text>

  <!-- TripService -> Queue1 -->
  <line x1="480" y1="258" x2="556" y2="258" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="518" y="248" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A" text-anchor="middle">on complete</text>
  <text x="518" y="276" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A" text-anchor="middle">(outbox)</text>

  <!-- Queue1 -> PaymentService -->
  <line x1="740" y1="258" x2="816" y2="258" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="778" y="248" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A" text-anchor="middle">consume</text>

  <!-- Queue1 -> DLQ -->
  <line x1="650" y1="286" x2="650" y2="346" stroke="#B3730A" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-fail)"/>
  <text x="662" y="310" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#B3730A">retries</text>
  <text x="662" y="324" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#B3730A">exhausted</text>

  <!-- Fraud <-> Payment -->
  <line x1="910" y1="148" x2="910" y2="228" stroke="#6B4FA0" stroke-width="2.5" marker-start="url(#arrow-sync)" marker-end="url(#arrow-sync)"/>
  <text x="920" y="180" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A">sync check ·</text>
  <text x="920" y="194" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A">retry + breaker</text>

  <!-- Payment -> Queue2 -->
  <line x1="1000" y1="258" x2="1076" y2="258" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="1038" y="248" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A" text-anchor="middle">publish</text>

  <!-- Queue2 -> Notification -->
  <line x1="1260" y1="258" x2="1336" y2="258" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#arrow-async)"/>
  <text x="1298" y="248" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A" text-anchor="middle">consume</text>

  <!-- Notification -> Webhook -->
  <line x1="1430" y1="286" x2="1430" y2="346" stroke="#70788A" stroke-width="2" marker-end="url(#arrow-neutral)"/>
  <text x="1440" y="312" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A">POST</text>
  <text x="1440" y="326" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#646E7A">webhook</text>

  <!-- ===== row A ===== -->

  <rect x="40" y="90" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="130" y="115" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">web</text>
  <text x="130" y="131" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">GUI + BFF, port 8080</text>

  <rect x="300" y="90" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="390" y="115" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">gateway</text>
  <text x="390" y="131" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">JWT · rate limit</text>

  <rect x="820" y="90" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="910" y="115" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">fraud-check-service</text>
  <text x="910" y="131" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">flaky target</text>
  <text x="988" y="106" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#646E7A" text-anchor="end">●</text>

  <!-- ===== row B ===== -->

  <rect x="300" y="230" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="390" y="253" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">trip-service</text>
  <text x="390" y="268" font-family="DejaVu Sans Mono, monospace" font-size="9.5" fill="#0E7C86" text-anchor="middle">requested→accepted→completed</text>
  <text x="390" y="280" font-family="DejaVu Sans, sans-serif" font-size="9.5" fill="#646E7A" text-anchor="middle">REST · OpenAPI · outbox</text>
  <text x="468" y="246" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#646E7A" text-anchor="end">●</text>

  <rect x="560" y="230" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="650" y="253" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">RabbitMQ queue</text>
  <text x="650" y="271" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="12.5" fill="#0E7C86" text-anchor="middle">trip.completed</text>

  <rect x="820" y="230" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="910" y="255" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">payment-service</text>
  <text x="910" y="271" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">idempotency · breaker</text>
  <text x="988" y="246" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#646E7A" text-anchor="end">●</text>

  <rect x="1080" y="230" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="1170" y="253" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">RabbitMQ queue</text>
  <text x="1170" y="271" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="12.5" fill="#0E7C86" text-anchor="middle">payment.completed</text>

  <rect x="1340" y="230" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#3A4654" stroke-width="1.5"/>
  <text x="1430" y="255" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="13.5" fill="#1C2127" text-anchor="middle">notification-service</text>
  <text x="1430" y="271" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">webhook</text>
  <text x="1508" y="246" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#646E7A" text-anchor="end">●</text>

  <!-- ===== row C ===== -->

  <rect x="565" y="350" width="170" height="48" rx="8" fill="#F7F6F2" stroke="#3A4654" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="650" y="370" font-family="DejaVu Sans, sans-serif" font-size="10.5" fill="#646E7A" text-anchor="middle">dead-letter queue</text>
  <text x="650" y="387" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="11.5" fill="#B3730A" text-anchor="middle">trip.completed.dlq</text>

  <rect x="1345" y="350" width="170" height="48" rx="8" fill="#F7F6F2" stroke="#3A4654" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="1430" y="370" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127" text-anchor="middle">Driver app</text>
  <text x="1430" y="387" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#646E7A" text-anchor="middle">(mock, logged)</text>

  <!-- legend -->
  <line x1="40" y1="425" x2="62" y2="425" stroke="#0E7C86" stroke-width="3"/>
  <text x="68" y="429" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">async · queue-mediated</text>

  <line x1="260" y1="425" x2="282" y2="425" stroke="#6B4FA0" stroke-width="3"/>
  <text x="288" y="429" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">sync · request/response</text>

  <line x1="490" y1="425" x2="512" y2="425" stroke="#B3730A" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="518" y="429" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">failure path · dead-letter</text>

  <line x1="760" y1="425" x2="782" y2="425" stroke="#70788A" stroke-width="3"/>
  <text x="788" y="429" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">proxy / webhook</text>

  <text x="980" y="429" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#1C2127">● instrumented — exposes /chaos + /metrics</text>
</svg>
