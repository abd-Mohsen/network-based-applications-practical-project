<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  var l = localStorage.getItem("rideflow.lang") || "ar";
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  var t = localStorage.getItem("rideflow.theme");
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
})();
</script>
<title>RideFlow — Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page">
  <div class="page-header">
    <h1 data-i18n="table.title"></h1>
    <p data-i18n="table.subtitle"></p>
    <div class="ts" id="ts" style="margin-top:8px;"></div>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab-btn active" data-tab="trips" role="tab">trips</button>
    <button type="button" class="tab-btn" data-tab="outbox" role="tab">outbox</button>
    <button type="button" class="tab-btn" data-tab="processed-events" role="tab">processed_events</button>
  </div>

  <div class="tab-panel" data-panel="trips">
    <div class="card" style="overflow-x:auto;">
      <table id="trips-table" class="mono">
        <thead>
          <tr>
            <th data-i18n="table.col.id"></th>
            <th data-i18n="table.col.origin"></th>
            <th data-i18n="table.col.destination"></th>
            <th data-i18n="table.col.fare"></th>
            <th data-i18n="table.col.status"></th>
            <th data-i18n="table.col.riderId"></th>
            <th data-i18n="table.col.driverId"></th>
            <th data-i18n="table.col.createdAt"></th>
            <th data-i18n="table.col.acceptedAt"></th>
            <th data-i18n="table.col.completedAt"></th>
            <th data-i18n="table.col.cancelledAt"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="trips-empty-hint" class="hint" data-i18n="table.empty" hidden></p>
    </div>
  </div>

  <div class="tab-panel" data-panel="outbox" hidden>
    <div class="card" style="overflow-x:auto;">
      <table id="outbox-table" class="mono">
        <thead>
          <tr>
            <th data-i18n="table.col.id"></th>
            <th data-i18n="table.col.eventType"></th>
            <th data-i18n="table.col.payload"></th>
            <th data-i18n="table.col.published"></th>
            <th data-i18n="table.col.createdAt"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="outbox-empty-hint" class="hint" data-i18n="table.empty" hidden></p>
    </div>
  </div>

  <div class="tab-panel" data-panel="processed-events" hidden>
    <div class="card" style="overflow-x:auto;">
      <table id="processed-events-table" class="mono">
        <thead>
          <tr>
            <th data-i18n="table.col.eventId"></th>
            <th data-i18n="table.col.tripId"></th>
            <th data-i18n="table.col.approved"></th>
            <th data-i18n="table.col.processedAt"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="processed-events-empty-hint" class="hint" data-i18n="table.empty" hidden></p>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script src="/table.js"></script>
</body>
</html>
