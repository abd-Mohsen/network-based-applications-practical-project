<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  var l = localStorage.getItem("rideflow.lang") || "ar";
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
})();
</script>
<title>RideFlow — Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page">
  <div class="page-header">
    <h1 data-i18n="driver.title"></h1>
    <p data-i18n-html="driver.subtitle"></p>
  </div>

  <div id="active"></div>

  <div class="grid grid-2" style="margin-top:28px;">
    <div>
      <h2 data-i18n="driver.incoming.heading" style="margin-bottom:14px;"></h2>
      <div id="queue"><div class="empty" data-i18n="rider.connecting"></div></div>
    </div>
    <div class="card" id="token-panel"></div>
  </div>

  <div class="page-header" style="margin-top:28px;">
    <h2 data-i18n="driver.history.heading"></h2>
  </div>
  <div id="history"><div class="empty" data-i18n="driver.history.empty"></div></div>
</div>
<script src="/app.js"></script>
<script src="/driver.js"></script>
</body>
</html>
