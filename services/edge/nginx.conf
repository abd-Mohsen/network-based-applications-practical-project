# RideFlow edge — real Nginx in front of the Express API gateway.
#
# This is the actual "API Gateway (Nginx)" layer for the presentation: every
# rider/driver write (and anything run through chaos/chaos.js) crosses this
# box before it ever reaches the gateway container. JWT verification and the
# per-user rate limit live in the gateway app behind it (services/gateway) —
# this file is deliberately left with Nginx's stock error pages untouched
# (no error_page override) so that stopping the gateway container produces a
# genuine, unmodified Nginx "502 Bad Gateway" — not a custom page pretending
# to be one.

limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;

    # Edge-level protection independent of the app's own per-user limiter:
    # caps concurrent in-flight connections from one IP. This is the "another
    # thing you can add to the gateway" bonus layer — connection limiting,
    # not request-rate limiting, so it won't fight the 2-req/min demo.
    limit_conn perip 20;

    location / {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Short timeouts so an unreachable gateway fails fast and visibly
        # (502) instead of hanging the demo for 60s.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }
}
